<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beat Sequencer</title>
  <link rel="stylesheet" href="../../css/styles.css">
  <link rel ="stylesheet" href="./sequencer.css">

</head>
<body>
  <main class="sequencer-page">
  <h1 class="title">Beat Sequencer</h1>

  <section class="controls panel">
    <button id="toggle-seq-btn">Play Sequencer</button>

    <div class="bpm-group">
      <label for="bpm-input">BPM</label>
      <input type="number" id="bpm-input" min="1" max="300" value="120">
    </div>

    <div class="steps-group">
      <label for="steps-input">Steps</label>
      <input type="number" id="steps-input" min="1" max="256" value="50">
    </div>

    <button id="clear-btn">Clear Track</button>
    <button id="save-draft-btn" type="button">Save Draft</button>
    <button id="load-draft-btn" type="button">Load Draft</button>

    <span id="step-counter" class="step-counter">Step: -- / 16</span>
    <span id="draft-status"></span>

    <span id="round-timer" class="round-timer" hidden>01:00</span>
    <button id="submit-beat-btn" type="button" hidden>Submit Beat</button>
    <span id="lobby-status" class="lobby-status"></span>
  </section>

  <section class="tracks-panel panel">
    <div id="section-ruler" class="track section-ruler">
      <span>Sections</span>
    </div>

    <div id="kick-track" class="track"></div>
    <div id="snare-track" class="track"></div>
    <div id="hihat-track" class="track"></div>
    <div id="bass-track" class="track"></div>

  </section>

  <section class="piano-roll-panel panel">
    <div class="piano-roll-header">
      <h2>Synth Piano Roll</h2>
      <div id="piano-track-strip"></div>
    </div>
    <div id="piano-roll" class="piano-roll"></div>
    <canvas id="piano-roll-canvas" width="800" height="260"></canvas>
  </section>

  <script src="/vendor/tone/Tone.js"></script>
  <script type="module" src="app.js"></script>
  </main>
</body>
</html>
