<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crude Sequencer</title>
  <script src="https://unpkg.com/tone"></script>

  <style>
    body { font-family: sans-serif; padding: 20px; }

    .controls { margin-bottom: 20px; display: flex; gap: 15px; align-items: center; }

    .track { display: flex; gap: 5px; margin-bottom: 20px; align-items: center; }
    .track span { width: 60px; font-weight: bold; }

    /* Checkbox Styling for Drums */
    input[type="checkbox"] {
      appearance: none;
      -webkit-appearance: none;
      width: 28px;
      height: 28px;
      background: #e0e0e0;
      border: 2px solid #ccc;
      border-radius: 50%;
      cursor: pointer;
      margin: 0;
      outline: none;
      transition: background 0.1s;
    }
    input[type="checkbox"]:checked {
      background: #ff5555;
      border-color: #cc0000;
    }
    input[type="checkbox"].playing {
      border: 2px solid #000;
      box-shadow: 0 0 8px rgba(0,0,0,0.5);
    }

    .piano-node {
      width: 24px;
      height: 24px;
      background: #e0e0e0;
      border: 2px solid #ccc;
      border-radius: 50%;
      cursor: pointer;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: bold;
      user-select: none;
      transition: background 0.1s;
    }
    .piano-node.has-note {
      background: #5555ff;
      color: white;
      border-color: #0000cc;
    }
    .piano-node.playing {
      border: 2px solid #000;
      box-shadow: 0 0 8px rgba(0,0,0,0.5);
    }

    .piano {
      display: flex;
      margin-top: 30px;
      margin-bottom: 20px;
      user-select: none;
    }
    .key {
      cursor: pointer;
      border-radius: 0 0 4px 4px;
      box-sizing: border-box;
    }
    .white-key {
      width: 40px;
      height: 150px;
      background: #fff;
      border: 1px solid #000;
      z-index: 1;
    }
    .white-key:active { background: #ddd; }
    .black-key {
      width: 24px;
      height: 90px;
      background: #000;
      z-index: 2;
      margin-left: -12px;
      margin-right: -12px;
    }
    .black-key:active { background: #444; }
  </style>
</head>
<body>
  <h1>Beat Sequencer</h1>

  <div class="controls">
    <button id="init-btn">Initialize Audio</button>
    <button id="toggle-seq-btn" disabled>Play Sequencer</button>

    <label for="bpm-input">BPM:</label>
    <input type="number" id="bpm-input" min="1" max="300" value="120" style="width: 60px;" disabled>

    <button id="clear-btn" disabled>Clear Track</button>

    <span id="step-counter" style="font-weight: bold; font-family: monospace; font-size: 1.2em;">Step: -- / 16</span>
  </div>

  <div id="kick-track" class="track">
    <span>Kick: </span>
  </div>

  <div id="snare-track" class="track">
    <span>Snare: </span>
  </div>

  <div id="hihat-track" class="track">
    <span>HiHat: </span>
  </div>

  <br>

  <div id="piano-track" class="track">
    <span>Synth: </span>
  </div>

  <div class="piano" id="piano-container">
    <div class="key white-key" data-note="C4"></div>
    <div class="key black-key" data-note="C#4"></div>
    <div class="key white-key" data-note="D4"></div>
    <div class="key black-key" data-note="D#4"></div>
    <div class="key white-key" data-note="E4"></div>
    <div class="key white-key" data-note="F4"></div>
    <div class="key black-key" data-note="F#4"></div>
    <div class="key white-key" data-note="G4"></div>
    <div class="key black-key" data-note="G#4"></div>
    <div class="key white-key" data-note="A4"></div>
    <div class="key black-key" data-note="A#4"></div>
    <div class="key white-key" data-note="B4"></div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
