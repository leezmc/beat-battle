<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crude Sequencer</title>
  <script src="https://unpkg.com/tone"></script>
  <link rel="stylesheet" href="../../css/styles.css">
  <link rel ="stylesheet" href="./sequencer.css">

</head>
<body>
  <main class="sequencer-page">
  <h1>Beat Sequencer</h1>

  <div class="controls">
    <button id="init-btn">Initialize Audio</button>
    <button id="toggle-seq-btn" disabled>Play Sequencer</button>

    <label for="bpm-input">BPM:</label>
    <input type="number" id="bpm-input" min="1" max="300" value="120" style="width: 60px;" disabled>

    <button id="clear-btn" disabled>Clear Track</button>

    <span id="step-counter" style="font-weight: bold; font-family: monospace; font-size: 1.2em;">Step: -- / 16</span>
  </div>

  <div id="kick-track" class="track">
    <span>Kick: </span>
  </div>

  <div id="snare-track" class="track">
    <span>Snare: </span>
  </div>

  <div id="hihat-track" class="track">
    <span>HiHat: </span>
  </div>

  <br>

  <div id="piano-track" class="track">
    <span>Synth: </span>
  </div>

  <div class="piano" id="piano-container">
    <div class="key white-key" data-note="C4"></div>
    <div class="key black-key" data-note="C#4"></div>
    <div class="key white-key" data-note="D4"></div>
    <div class="key black-key" data-note="D#4"></div>
    <div class="key white-key" data-note="E4"></div>
    <div class="key white-key" data-note="F4"></div>
    <div class="key black-key" data-note="F#4"></div>
    <div class="key white-key" data-note="G4"></div>
    <div class="key black-key" data-note="G#4"></div>
    <div class="key white-key" data-note="A4"></div>
    <div class="key black-key" data-note="A#4"></div>
    <div class="key white-key" data-note="B4"></div>
  </div>

  <script type="module" src="app.js"></script>
  </main>
</body>
</html>
